name: RW04 system codecs
on:
  pull_request:
    paths:
      - 'labs/remote-workspace/system-codec-probe/**'
      - 'labs/remote-workspace/webrtc-probe/vm_probe.*'
      - 'labs/remote-workspace/preview/windows.cpp'
      - 'labs/remote-workspace/preview/macos.m'
      - 'labs/remote-workspace/examples/worker_exit_simulation.rs'
      - 'labs/remote-workspace/src/coordinator.rs'
      - 'apps/peerglide-gui/examples/workspace_lab.rs'
      - 'apps/peerglide-gui/examples/workspace_lab/**'
      - 'apps/peerglide-gui/Cargo.toml'
      - '.github/workflows/workspace-codec-probe.yml'
permissions:
  contents: read
jobs:
  native-h264:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Derive build version from commit time (UTC+08:00)
        shell: bash
        run: python tools/build_version.py >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Roundtrip a synthetic stream through Media Foundation
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /O2 "%GITHUB_WORKSPACE%\labs\remote-workspace\system-codec-probe\windows.cpp" mfplat.lib mfuuid.lib wmcodecdspuuid.lib ole32.lib /link /out:rw04-h264.exe
          if errorlevel 1 exit /b 1
          rw04-h264.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 /DUNICODE /D_UNICODE /DLINKO_RW03_CI /DLINKO_RW04_WGC_CODEC_CI /O2 /c "%GITHUB_WORKSPACE%\labs\remote-workspace\preview\windows.cpp" /Fo:rw04-wgc.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /DLINKO_RW04_WGC_CODEC_CI /O2 /c "%GITHUB_WORKSPACE%\labs\remote-workspace\system-codec-probe\windows.cpp" /Fo:rw04-system-codec.obj
          if errorlevel 1 exit /b 1
          link /nologo /out:rw04-wgc-h264.exe rw04-wgc.obj rw04-system-codec.obj d3d11.lib dwmapi.lib user32.lib gdi32.lib windowsapp.lib mfplat.lib mfuuid.lib wmcodecdspuuid.lib ole32.lib dbghelp.lib
          if errorlevel 1 exit /b 1
          setlocal EnableDelayedExpansion
          for /l %%n in (1,1,30) do (
            echo WGC codec attempt %%n of 30
            rw04-wgc-h264.exe
            if not "!ERRORLEVEL!"=="0" exit /b !ERRORLEVEL!
          )
      - name: Build the VideoToolbox fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcrun clang -std=c17 -Wall -Wextra -Werror -O2 -g -c labs/remote-workspace/system-codec-probe/macos.c \
            -o "$RUNNER_TEMP/rw04-vt.o"
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -O2 -g -c labs/remote-workspace/webrtc-probe/vm_probe.cc \
            -o "$RUNNER_TEMP/rw04-vm.o"
          xcrun clang++ "$RUNNER_TEMP/rw04-vt.o" "$RUNNER_TEMP/rw04-vm.o" \
            -framework CoreFoundation -framework CoreMedia -framework CoreVideo -framework VideoToolbox \
            -o "$RUNNER_TEMP/rw04-h264"
      - name: Roundtrip a synthetic stream through VideoToolbox
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "$RUNNER_TEMP/rw04-h264"
          "$RUNNER_TEMP/rw04-h264" --software
          fixtures=('224 144' '350 262' '352 262' '350 272' '352 272'
                    '350 262 encode' '350 262 decode' '350 262 encode-nv12' '350 262 encode-soak')
          for fixture in "${fixtures[@]}"; do
            read -r width height stage <<< "$fixture"
            arguments=(--vm "$width" "$height")
            if [[ -n "$stage" ]]; then
              arguments+=("$stage")
            fi
            status=0
            "$RUNNER_TEMP/rw04-h264" "${arguments[@]}" || status=$?
            if [[ "$status" == 139 ]]; then
              xcrun lldb --no-lldbinit --batch -o run -k 'thread backtrace all' \
                -- "$RUNNER_TEMP/rw04-h264" "${arguments[@]}" || true
            fi
            if [[ "$status" != 0 ]]; then
              exit "$status"
            fi
          done
      - name: Verify VideoToolbox worker control and replacement
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: python labs/remote-workspace/system-codec-probe/worker_smoke.py "$RUNNER_TEMP/rw04-h264"
      - name: Route the native codec worker exit through the workspace coordinator
        shell: bash
        timeout-minutes: 3
        working-directory: labs/remote-workspace
        env:
          CODEC_FIXTURE: ${{ runner.os == 'Windows' && 'rw04-h264.exe' || 'rw04-h264' }}
        run: cargo run --locked --offline --example worker_exit_simulation -- --native-codec "$RUNNER_TEMP/$CODEC_FIXTURE"
      - name: Route actual Windows window frames through the native codec worker
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 3
        working-directory: labs/remote-workspace
        run: cargo run --locked --offline --example worker_exit_simulation -- --native-window "$RUNNER_TEMP/rw04-wgc-h264.exe"
      - name: Roundtrip two live WGC windows through persistent Media Foundation sessions
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 1
        run: |
          & "$env:RUNNER_TEMP/rw04-wgc-h264.exe" --dual-codec
          exit $LASTEXITCODE
      - name: Route actual macOS window frames through the native codec worker
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 3
        run: |
          xcrun clang -std=c17 -Wall -Wextra -Werror -O2 -Dmain=linko_codec_fixture_main \
            -c labs/remote-workspace/system-codec-probe/macos.c -o "$RUNNER_TEMP/rw04-vt-sck.o"
          xcrun clang -std=c17 -mmacosx-version-min=14.0 -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -Wno-unused-parameter -O2 -DLINKO_RW03_CI -DLINKO_RW04_SCK_CODEC_CI \
            -c labs/remote-workspace/preview/macos.m -o "$RUNNER_TEMP/rw04-sck.o"
          xcrun clang++ "$RUNNER_TEMP/rw04-sck.o" "$RUNNER_TEMP/rw04-vt-sck.o" "$RUNNER_TEMP/rw04-vm.o" \
            -framework AppKit -framework CoreFoundation -framework CoreGraphics -framework CoreImage \
            -framework CoreMedia -framework CoreVideo -framework QuartzCore -framework ScreenCaptureKit \
            -framework VideoToolbox -o "$RUNNER_TEMP/rw04-sck-h264"
          cargo run --locked --offline --manifest-path labs/remote-workspace/Cargo.toml \
            --example worker_exit_simulation -- --native-window "$RUNNER_TEMP/rw04-sck-h264"
      - name: Roundtrip two live ScreenCaptureKit windows through persistent VideoToolbox sessions
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 1
        run: '"$RUNNER_TEMP/rw04-sck-h264" --dual-codec'
      - uses: actions/upload-artifact@v4
        with:
          name: rw06-window-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/${{ runner.os == 'Windows' && 'rw04-wgc-h264.exe' || 'rw04-sck-h264' }}
          retention-days: 1
          if-no-files-found: error

  native-workspace-panel:
    needs: native-h264
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Derive build version from commit time (UTC+08:00)
        shell: bash
        run: python tools/build_version.py >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: rw06-window-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/rw06-window-fixture
      - name: Verify window pixels and clearing in the native eframe panel
        shell: bash
        env:
          CODEC_FIXTURE: ${{ runner.os == 'Windows' && 'rw04-wgc-h264.exe' || 'rw04-sck-h264' }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: fxc
        run: |
          fixture="$RUNNER_TEMP/rw06-window-fixture/$CODEC_FIXTURE"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            chmod +x "$fixture"
          fi
          cargo build --locked --offline --manifest-path labs/remote-workspace/Cargo.toml --example worker_exit_simulation
          launcher="$GITHUB_WORKSPACE/labs/remote-workspace/target/debug/examples/worker_exit_simulation$EXE_SUFFIX"
          options=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            options+=(--features workspace-lab-dx12)
          fi
          cargo run --locked -p peerglide-gui --example workspace_lab "${options[@]}" -- --native-window-probe "$launcher" "$fixture"
      - name: Verify live frame updates, receipts and independent panel clearing
        shell: bash
        timeout-minutes: 3
        env:
          CODEC_FIXTURE: ${{ runner.os == 'Windows' && 'rw04-wgc-h264.exe' || 'rw04-sck-h264' }}
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: fxc
        run: |
          fixture="$RUNNER_TEMP/rw06-window-fixture/$CODEC_FIXTURE"
          options=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            options+=(--features workspace-lab-dx12)
          fi
          cargo run --locked -p peerglide-gui --example workspace_lab "${options[@]}" -- --live-window-probe "$fixture"
