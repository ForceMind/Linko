name: RW04 system codecs
on:
  pull_request:
    paths:
      - 'labs/remote-workspace/system-codec-probe/**'
      - 'labs/remote-workspace/webrtc-probe/vm_probe.*'
      - 'labs/remote-workspace/preview/windows.cpp'
      - 'labs/remote-workspace/examples/worker_exit_simulation.rs'
      - 'labs/remote-workspace/src/coordinator.rs'
      - '.github/workflows/workspace-codec-probe.yml'
permissions:
  contents: read
jobs:
  native-h264:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Derive build version from commit time (UTC+08:00)
        shell: bash
        run: python tools/build_version.py >> "$GITHUB_ENV"
      - name: Roundtrip a synthetic stream through Media Foundation
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /O2 "%GITHUB_WORKSPACE%\labs\remote-workspace\system-codec-probe\windows.cpp" mfplat.lib mfuuid.lib wmcodecdspuuid.lib ole32.lib /link /out:rw04-h264.exe
          if errorlevel 1 exit /b 1
          rw04-h264.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 /DUNICODE /D_UNICODE /DLINKO_RW03_CI /DLINKO_RW04_WGC_CODEC_CI /O2 /c "%GITHUB_WORKSPACE%\labs\remote-workspace\preview\windows.cpp" /Fo:rw04-wgc.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /DLINKO_RW04_WGC_CODEC_CI /O2 /c "%GITHUB_WORKSPACE%\labs\remote-workspace\system-codec-probe\windows.cpp" /Fo:rw04-system-codec.obj
          if errorlevel 1 exit /b 1
          link /nologo /out:rw04-wgc-h264.exe rw04-wgc.obj rw04-system-codec.obj d3d11.lib dwmapi.lib user32.lib gdi32.lib windowsapp.lib mfplat.lib mfuuid.lib wmcodecdspuuid.lib ole32.lib dbghelp.lib
          if errorlevel 1 exit /b 1
          setlocal EnableDelayedExpansion
          for /l %%n in (1,1,30) do (
            echo WGC codec attempt %%n of 30
            rw04-wgc-h264.exe
            if not "!ERRORLEVEL!"=="0" exit /b !ERRORLEVEL!
          )
      - name: Roundtrip a synthetic stream through VideoToolbox
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcrun clang -std=c17 -Wall -Wextra -Werror -O2 -g -c labs/remote-workspace/system-codec-probe/macos.c \
            -o "$RUNNER_TEMP/rw04-vt.o"
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -O2 -g -c labs/remote-workspace/webrtc-probe/vm_probe.cc \
            -o "$RUNNER_TEMP/rw04-vm.o"
          xcrun clang++ "$RUNNER_TEMP/rw04-vt.o" "$RUNNER_TEMP/rw04-vm.o" \
            -framework CoreFoundation -framework CoreMedia -framework CoreVideo -framework VideoToolbox \
            -o "$RUNNER_TEMP/rw04-h264"
          "$RUNNER_TEMP/rw04-h264"
          "$RUNNER_TEMP/rw04-h264" --software
          fixtures=('224 144' '350 262' '352 262' '350 272' '352 272'
                    '350 262 encode' '350 262 decode' '350 262 encode-nv12' '350 262 encode-soak')
          for fixture in "${fixtures[@]}"; do
            read -r width height stage <<< "$fixture"
            arguments=(--vm "$width" "$height")
            if [[ -n "$stage" ]]; then
              arguments+=("$stage")
            fi
            status=0
            "$RUNNER_TEMP/rw04-h264" "${arguments[@]}" || status=$?
            if [[ "$status" == 139 ]]; then
              xcrun lldb --no-lldbinit --batch -o run -k 'thread backtrace all' \
                -- "$RUNNER_TEMP/rw04-h264" "${arguments[@]}" || true
            fi
            if [[ "$status" != 0 ]]; then
              exit "$status"
            fi
          done
      - name: Verify VideoToolbox worker control and replacement
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: python labs/remote-workspace/system-codec-probe/worker_smoke.py "$RUNNER_TEMP/rw04-h264"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Route the native codec worker exit through the workspace coordinator
        shell: bash
        timeout-minutes: 3
        working-directory: labs/remote-workspace
        env:
          CODEC_FIXTURE: ${{ runner.os == 'Windows' && 'rw04-h264.exe' || 'rw04-h264' }}
        run: cargo run --locked --offline --example worker_exit_simulation -- --native-codec "$RUNNER_TEMP/$CODEC_FIXTURE"
