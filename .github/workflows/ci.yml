name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Standalone CLI dependency features
        run: cargo check -p peerglide-desktop --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Synthetic gesture corpus metrics (not human acceptance)
        run: cargo test -p peerglide-gestures --test corpus --locked -- --nocapture
      - name: Verify macOS keycodes against active SDK
        if: runner.os == 'macOS'
        run: python tools/verify_macos_keycodes.py
      - name: macOS isolated and parallel GUI regression stress
        if: runner.os == 'macOS'
        run: |
          rustc -vV
          sw_vers
          cargo test -p peerglide-gui --locked all_configuration_pages_render_in_both_themes_without_a_display -- --exact tests::all_configuration_pages_render_in_both_themes_without_a_display
          for iteration in {1..20}; do
            echo "GUI parallel iteration ${iteration}"
            cargo test -p peerglide-gui --locked -- --test-threads=8
          done
      - run: cargo build --release --workspace --locked
      - run: python tools/smoke.py
      - run: python tools/reconnect_smoke.py
      - run: python tools/context_smoke.py
      - name: macOS cooperative system-terminate check (no native input)
        if: runner.os == 'macOS'
        run: python tools/macos_exit_smoke.py target/release
      - run: python -m unittest discover -s tools -p test_third_party.py
      - run: python -m unittest discover -s tools -p test_package.py
      - run: python tools/third_party.py
      - name: GUI runtime smoke on isolated Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
          xvfb-run -a python tools/gui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: peerglide-gui-screenshots
          path: dist/peerglide-*.png
          if-no-files-found: error
      - run: python tools/package.py
      - name: Verify extracted macOS identity and tamper rejection
        if: runner.os == 'macOS'
        run: python tools/verify_macos_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: peerglide-prototype-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned lockfile auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Deny known vulnerabilities and advisory warnings
        run: cargo audit --deny warnings --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peerglide-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace --all-targets --locked
