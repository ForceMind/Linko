name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Derive the workspace example version from commit time (UTC+08:00)
        shell: bash
        run: python tools/build_version.py >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Synthetic gesture corpus metrics (not human acceptance)
        run: cargo test -p peerglide-gestures --test corpus --locked -- --nocapture
      - name: Verify macOS keycodes against active SDK
        if: runner.os == 'macOS'
        run: python tools/verify_macos_keycodes.py
      - name: macOS isolated and parallel GUI regression stress
        if: runner.os == 'macOS'
        run: |
          rustc -vV
          sw_vers
          cargo test -p peerglide-gui --locked all_configuration_pages_render_in_both_themes_without_a_display -- --exact tests::all_configuration_pages_render_in_both_themes_without_a_display
          for iteration in {1..20}; do
            echo "GUI parallel iteration ${iteration}"
            cargo test -p peerglide-gui --locked -- --test-threads=8
          done
      - run: cargo build --release --workspace --locked
      - name: Build and test the offline workspace canvas
        run: |
          cargo test --locked -p peerglide-gui --example workspace_lab
          cargo build --locked --release -p peerglide-gui --example workspace_lab
      - name: Verify recovery journal across forced process termination
        run: cargo run --locked -p peerglide-gui --example workspace_recovery -- --smoke
      - name: Verify a Win32 window survives recovery worker crashes
        if: runner.os == 'Windows'
        shell: cmd
        timeout-minutes: 3
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /O2 /Fo:"%RUNNER_TEMP%\linko-recovery.obj" labs\remote-workspace\preview\windows_recovery.cpp /link user32.lib bcrypt.lib /out:"%RUNNER_TEMP%\linko-recovery.exe"
          if errorlevel 1 exit /b 1
          cargo run --locked -p peerglide-gui --example workspace_recovery -- --native-smoke "%RUNNER_TEMP%\linko-recovery.exe"
      - run: python tools/smoke.py
      - run: python tools/reconnect_smoke.py
      - run: python -m unittest discover -s tools -p test_third_party.py
      - run: python tools/third_party.py
      - name: GUI runtime smoke on isolated Linux display
        if: runner.os == 'Linux'
        env:
          LINKO_WORKSPACE_SMOKE_DEST: ${{ runner.temp }}/rw06-workspace
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
          xvfb-run -a python tools/gui_smoke.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: peerglide-gui-screenshots
          path: dist/peerglide-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linko-rw06-workspace-screenshots
          path: ${{ runner.temp }}/rw06-workspace/*.png
          if-no-files-found: error
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: peerglide-prototype-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned lockfile auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Deny known vulnerabilities and advisory warnings
        run: cargo audit --deny warnings --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peerglide-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace --all-targets --locked
