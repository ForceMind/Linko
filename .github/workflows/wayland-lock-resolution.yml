name: Resolve Wayland input capture lock
on:
  pull_request:
    branches: [roadmap-integration]
    paths:
      - '.github/workflows/wayland-lock-resolution.yml'
permissions:
  contents: read
jobs:
  resolve:
    if: github.event.pull_request.head.ref == 'wayland-input-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: wayland-input-capture-lock
          path: Cargo.lock
          if-no-files-found: error
