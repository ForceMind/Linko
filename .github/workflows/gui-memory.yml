name: GUI memory diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gui-memory.yml'
      - 'tools/gui_memory_smoke.py'
      - 'tools/test_gui_memory_smoke.py'
      - 'apps/peerglide-gui/**'
permissions:
  contents: read
jobs:
  idle-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sampler boundary and cleanup tests
        run: python -m unittest discover -s tools -p test_gui_memory_smoke.py
      - name: Build the matching GUI and CLI
        run: cargo build --release --locked -p peerglide-gui -p peerglide-desktop
      - name: Install isolated Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
      - name: Prepare report directory
        run: mkdir -p dist
      - name: Idle GUI memory under isolated display
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python tools/gui_memory_smoke.py target/release --report dist/gui-memory-linux.json --duration 180 --rss-limit-mib 512 --growth-limit-mib 64
      - name: macOS environment
        if: runner.os == 'macOS'
        run: sw_vers
      - name: Idle GUI memory on macOS runner
        if: runner.os == 'macOS'
        run: python tools/gui_memory_smoke.py target/release --report dist/gui-memory-macos.json --duration 180 --rss-limit-mib 512 --growth-limit-mib 64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-memory-${{ matrix.os }}
          path: dist/gui-memory-*.json
          if-no-files-found: error
