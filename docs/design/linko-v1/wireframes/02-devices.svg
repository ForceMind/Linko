<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">02 设备管理与按需详情</title>
<desc id="desc">Linko / 屏跃的可编辑中文设计线稿，非运行界面。未声明真实配对、输入控制、文件或剪贴板验收。</desc>
<style>text{font-family:sans-serif;fill:#20252D;font-size:16px} .muted{fill:#5F6F85} .small{font-size:14px} .body{font-size:18px} .heading{font-size:22px;font-weight:600} .title{font-size:30px;font-weight:600} .strong{font-weight:600} .brand{fill:#4263EB}</style>
