<text x="30" y="878">设置</text>
<line x1="24" y1="826" x2="166" y2="826" stroke="#E2E7EF" stroke-width="1"/>
<text x="222" y="60" class="title">屏幕布局</text>
<text x="222" y="97" class="body muted">连接你的另一台电脑。</text>
