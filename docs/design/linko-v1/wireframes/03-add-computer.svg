<text x="1193" y="98" class="small muted" text-anchor="middle">当前未开启键鼠</text>
<line x1="222" y1="912" x2="1408" y2="912" stroke="#E2E7EF" stroke-width="1"/>
<text x="222" y="942" class="small muted">设计线稿 · 非运行界面</text>
<text x="1408" y="942" class="small muted" text-anchor="end">未登记：仅本机与添加空位 · 配对码运行时生成</text>
<g aria-hidden="true">
<rect x="222" y="160" width="828" height="676" rx="16" fill="#F7F8FA" stroke="#E2E7EF" stroke-width="1"/>
