<text x="426" y="616" class="small muted">默认关闭</text>
<rect x="1116" y="585" width="50" height="26" rx="13" fill="#EFF1F5" stroke="#5F6F85" stroke-width="1"/>
<circle cx="1129" cy="598" r="10" fill="#FFFFFF" stroke="#5F6F85"/>
<text x="404" y="673">双方核验并确认后才记住设备。</text>
<text x="404" y="704" class="small muted">配对不会开启键鼠或内容共享。</text>
<rect x="404" y="760" width="108" height="42" rx="8" fill="#FFFFFF" stroke="#5F6F85" stroke-width="1"/>
<text x="458.0" y="787.0" text-anchor="middle" style="fill:#20252D;font-size:16px">取消</text>
<rect x="990" y="760" width="200" height="42" rx="8" fill="#4263EB" stroke="#4263EB" stroke-width="1"/>
<text x="1090.0" y="787.0" text-anchor="middle" style="fill:#FFFFFF;font-size:16px">准备这台电脑</text>
</svg>
