<text x="1190" y="223" class="heading" text-anchor="end">×</text>
<text x="404" y="271" class="strong brand">1  连接方式</text>
<line x1="548" y1="265" x2="616" y2="265" stroke="#E2E7EF" stroke-width="1"/>
<text x="642" y="271" class="muted">2  核验设备</text>
<line x1="786" y1="265" x2="854" y2="265" stroke="#E2E7EF" stroke-width="1"/>
<text x="880" y="271" class="muted">3  完成</text>
<rect x="404" y="300" width="786" height="46" rx="10" fill="#F7F8FA" stroke="#E2E7EF" stroke-width="1"/>
<rect x="404" y="300" width="393" height="46" rx="10" fill="#E8EEFF" stroke="#4263EB" stroke-width="1"/>
<text x="600.5" y="330" class="strong brand" text-anchor="middle">显示配对码</text>
<text x="993.5" y="330" class="muted" text-anchor="middle">输入配对码</text>
<text x="404" y="394" class="heading">首次使用，准备安全配对</text>
<text x="404" y="424" class="muted">先创建这台电脑的配对身份。</text>
<rect x="404" y="450" width="786" height="92" rx="12" fill="#F7F8FA" stroke="#E2E7EF" stroke-width="1"/>
<text x="426" y="487" class="body strong">配对码将在此显示</text>
<text x="426" y="518" class="small muted">准备身份后，由你发起显示配对码。</text>
