<text x="935" y="478" class="small muted" text-anchor="middle">尺寸未知</text>
<text x="806" y="562" class="small muted" text-anchor="middle">另一台电脑在本机右侧</text>
<circle cx="238" cy="649" r="13" fill="#2563eb"/><text x="238" y="654" text-anchor="middle" style="font-size:14px;fill:#fff;font-weight:600">2</text>
