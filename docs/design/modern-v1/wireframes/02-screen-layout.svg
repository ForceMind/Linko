<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">02 屏幕布局</title>
<desc id="desc">屏跃现代界面的低保真结构线稿。设计线稿 · 非运行界面；文字可编辑，不代表功能已实现。</desc>
<style>text{font-family:sans-serif;fill:#303741} .muted{fill:#68717e} .small{font-size:14px} .label{font-size:16px} .body{font-size:18px} .title{font-size:30px;font-weight:600} .strong{font-weight:600} .tiny{font-size:14px}</style>
