<text x="28" y="422" class="tiny muted">开发中</text>
<line x1="20" y1="858" x2="170" y2="858" stroke="#bbc2cc"/>
<text x="28" y="900" class="label">设置</text>

<text x="222" y="60" class="title">设备与屏幕</text>
<text x="222" y="98" class="body muted">一套键鼠，自在穿梭。</text>
