<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">屏跃 · 总览 · 中文交互线框</title>
<desc id="desc">原创黑白灰低保真设计。所有设备、权限、文件和进度均为示例，不联网、不读取数据、不执行系统动作。</desc>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#fff" stroke="none"/>
<rect x="0" y="0" width="212" height="820" rx="0" fill="#f5f5f5" stroke="none"/>
<line x1="212" y1="0" x2="212" y2="820" stroke="#d0d0d0" stroke-width="1"/>
<line x1="212" y1="76" x2="1200" y2="76" stroke="#d0d0d0" stroke-width="1"/>
<text x="28" y="39" font-size="27" font-weight="700" fill="#252525">屏跃</text>
<text x="28" y="65" font-size="13" font-weight="400" fill="#666">鼠标增强与多机协同</text>
<text x="244" y="32" font-size="15" font-weight="400" fill="#555">本机控制 · 连接状态为示例</text>
<text x="244" y="55" font-size="13" font-weight="400" fill="#777">停止与恢复入口始终可见</text>
<rect x="844" y="20" width="142" height="36" rx="5" fill="#fff" stroke="#b6b6b6"/>
<text x="858" y="43.0" font-size="15" font-weight="500" fill="#333">暂停本机手势</text>
<rect x="1002" y="20" width="174" height="36" rx="5" fill="#333" stroke="#444"/>
<text x="1016" y="43.0" font-size="15" font-weight="500" fill="#fff">紧急恢复本机控制</text>
<rect x="16" y="121" width="180" height="44" rx="5" fill="#e3e3e3" stroke="#999"/>
<rect x="29" y="135" width="16" height="16" rx="2" fill="#fff" stroke="#777"/>
<text x="34" y="147" font-size="10" font-weight="400" fill="#555">1</text>
<text x="58" y="150" font-size="17" font-weight="600" fill="#252525">总览</text>
<rect x="29" y="192" width="16" height="16" rx="2" fill="#fff" stroke="#777"/>
<text x="34" y="204" font-size="10" font-weight="400" fill="#555">2</text>
<text x="58" y="207" font-size="17" font-weight="400" fill="#252525">设备与屏幕</text>
<rect x="29" y="249" width="16" height="16" rx="2" fill="#fff" stroke="#777"/>
<text x="34" y="261" font-size="10" font-weight="400" fill="#555">3</text>
<text x="58" y="264" font-size="17" font-weight="400" fill="#252525">本机鼠标</text>
<rect x="29" y="306" width="16" height="16" rx="2" fill="#fff" stroke="#777"/>
<text x="34" y="318" font-size="10" font-weight="400" fill="#555">4</text>
<text x="58" y="321" font-size="17" font-weight="400" fill="#252525">剪贴板与文件</text>
<rect x="29" y="363" width="16" height="16" rx="2" fill="#fff" stroke="#777"/>
<text x="34" y="375" font-size="10" font-weight="400" fill="#555">5</text>
<text x="58" y="378" font-size="17" font-weight="400" fill="#252525">设置</text>
<line x1="24" y1="684" x2="188" y2="684" stroke="#d4d4d4" stroke-width="1"/>
<text x="28" y="714" font-size="14" font-weight="400" fill="#555">本机鼠标：关闭</text>
<text x="28" y="741" font-size="14" font-weight="400" fill="#555">跨屏控制：关闭</text>
<text x="28" y="782" font-size="12" font-weight="400" fill="#777">界面与状态均为示例</text>
<line x1="236" y1="780" x2="1180" y2="780" stroke="#c8c8c8" stroke-width="1"/>
<text x="244" y="805" font-size="14" font-weight="600" fill="#444">交互线框·示例数据·非运行软件</text>
<text x="1031" y="805" font-size="13" font-weight="400" fill="#777">设计 0.3.0</text>
<text x="244" y="119" font-size="26" font-weight="650" fill="#252525">先从一件事开始</text>
<text x="244" y="148" font-size="15" font-weight="400" fill="#666">一台电脑也能用。连接另一台电脑后，再配置协同。</text>
<rect x="244" y="180" width="448" height="242" rx="7" fill="#fff" stroke="#c4c4c4"/>
<text x="268" y="219" font-size="22" font-weight="600" fill="#252525">增强本机鼠标</text>
<rect x="588" y="194" width="80" height="25" rx="4" fill="#eee" stroke="#d2d2d2"/>
<text x="596" y="212" font-size="12" font-weight="400" fill="#666">G1 规划</text>
<text x="268" y="255" font-size="18" font-weight="550" fill="#252525">不需要另一台电脑</text>
<text x="268" y="292" font-size="15" font-weight="400" fill="#666">录制手势 → 选动作 → 本窗口测试</text>
<text x="268" y="316" font-size="15" font-weight="400" fill="#666">保存规则后，再单独决定是否启用。</text>
<rect x="268" y="356" width="208" height="39" rx="5" fill="#333" stroke="#444"/>
<text x="282" y="380.5" font-size="15" font-weight="500" fill="#fff">去配置本机鼠标</text>
<rect x="492" y="356" width="176" height="39" rx="5" fill="#fff" stroke="#b6b6b6"/>
<text x="506" y="380.5" font-size="15" font-weight="500" fill="#333">先试离线画布</text>
<rect x="716" y="180" width="452" height="242" rx="7" fill="#fff" stroke="#c4c4c4"/>
<text x="740" y="219" font-size="22" font-weight="600" fill="#252525">连接另一台电脑</text>
<text x="740" y="255" font-size="18" font-weight="550" fill="#252525">把多机协同分步配置</text>
<text x="740" y="292" font-size="15" font-weight="400" fill="#666">添加设备，分别核验身份与选择权限。</text>
<text x="740" y="316" font-size="15" font-weight="400" fill="#666">连接后摆放屏幕，键鼠控制默认关闭。</text>
<rect x="740" y="356" width="174" height="39" rx="5" fill="#333" stroke="#444"/>
<text x="754" y="380.5" font-size="15" font-weight="500" fill="#fff">添加设备</text>
<rect x="930" y="356" width="212" height="39" rx="5" fill="#fff" stroke="#b6b6b6"/>
<text x="944" y="380.5" font-size="15" font-weight="500" fill="#333">了解连接步骤</text>
<rect x="244" y="448" width="924" height="112" rx="7" fill="#fafafa" stroke="#c4c4c4"/>
<text x="268" y="480" font-size="16" font-weight="550" fill="#252525">本机鼠标</text>
<text x="268" y="509" font-size="18" font-weight="600" fill="#252525">关闭</text>
<text x="330" y="508" font-size="14" font-weight="400" fill="#666">可先离线配置</text>
<text x="572" y="480" font-size="16" font-weight="550" fill="#252525">跨屏键鼠</text>
<text x="572" y="509" font-size="18" font-weight="600" fill="#252525">关闭</text>
<text x="634" y="508" font-size="14" font-weight="400" fill="#666">连接后单独授权</text>
<text x="876" y="480" font-size="16" font-weight="550" fill="#252525">文本与文件</text>
<text x="876" y="509" font-size="18" font-weight="600" fill="#252525">关闭</text>
<text x="938" y="508" font-size="14" font-weight="400" fill="#666">权限互不代替</text>
<line x1="550" y1="466" x2="550" y2="541" stroke="#ddd" stroke-width="1"/>
<line x1="854" y1="466" x2="854" y2="541" stroke="#ddd" stroke-width="1"/>
<text x="244" y="600" font-size="19" font-weight="600" fill="#252525">下一步</text>
<rect x="244" y="620" width="448" height="126" rx="7" fill="#fff" stroke="#c4c4c4"/>
<text x="268" y="652" font-size="18" font-weight="550" fill="#252525">完成第一条鼠标规则</text>
<text x="268" y="680" font-size="15" font-weight="400" fill="#666">先录制一个轨迹，再做本窗口测试。</text>
<rect x="268" y="700" width="136" height="31" rx="5" fill="#fff" stroke="#b6b6b6"/>
<text x="282" y="720.5" font-size="15" font-weight="500" fill="#333">继续配置</text>
<rect x="716" y="620" width="452" height="126" rx="7" fill="#fff" stroke="#c4c4c4"/>
<text x="740" y="652" font-size="18" font-weight="550" fill="#252525">添加第一台电脑</text>
<text x="740" y="680" font-size="15" font-weight="400" fill="#666">先建立信任，再考虑跨屏控制。</text>
<rect x="740" y="700" width="136" height="31" rx="5" fill="#fff" stroke="#b6b6b6"/>
<text x="754" y="720.5" font-size="15" font-weight="500" fill="#333">开始添加</text>
</g>
</svg>
